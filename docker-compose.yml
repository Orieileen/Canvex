services:
  postgres:
    image: postgres:16
    container_name: canvex_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-canvex}
      POSTGRES_USER: ${POSTGRES_USER:-canvex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-canvex}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-canvex} -d $${POSTGRES_DB:-canvex}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: canvex_redis
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: canvex_backend
    env_file:
      - ./.env
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
    command: bash -lc "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "${BACKEND_PORT:-28000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: canvex_worker
    env_file:
      - ./.env
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
    command: bash -lc "celery -A config worker -l info -Q excalidraw -n excalidraw@%h -c 2 -Ofair --prefetch-multiplier=1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      backend:
        condition: service_started
    restart: unless-stopped

  # canvas: LLM agent + 图/视频生成 (IO 密集) → gevent，高并发轮询不吃 CPU。
  worker_canvas:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: canvex_worker_canvas
    env_file:
      - ./.env
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
    command: bash -lc "celery -A config worker -l info -Q canvas -n canvas@%h --pool=gevent -c 20 -Ofair --prefetch-multiplier=1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      backend:
        condition: service_started
    restart: unless-stopped

  # canvas_cpu: cutout rembg 白转 alpha (CPU 密集) → prefork，低并发避免吃满核。
  worker_canvas_cpu:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: canvex_worker_canvas_cpu
    env_file:
      - ./.env
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
    command: bash -lc "celery -A config worker -l info -Q canvas_cpu -n canvas_cpu@%h --pool=prefork -c 2 -Ofair --prefetch-multiplier=1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      backend:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: canvex_frontend
    env_file:
      - ./.env
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:28000}
      VITE_CANVEX_ASSET_PATH: ${VITE_CANVEX_ASSET_PATH:-/canvex-assets/}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
