<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ring-hover-mirror.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      window.global = window
      window.process = window.process || { env: {} }
      window.EXCALIDRAW_ASSET_PATH = window.EXCALIDRAW_ASSET_PATH || '/canvex-assets/'
    </script>
    <title>Canvex</title>
    <!--
      压掉 macOS 触摸板「双指横滑 = 浏览器前进/后退」。

      **必须内联在这里, 不能放 index.css。** 画布上两指横滑就是平移, 而这个手势会把
      整个页面导航走。JS 那一道 (hooks/use-suppress-swipe-nav) 要等 bundle 下载 + React
      挂载 + effect 跑完才生效 —— 在那之前的每一次横滑都会真的返回。dev server 慢的时候
      这个窗口有一两秒, 而"刷新之后立刻划一下"恰好落在里面。样式表同理: Vite 是由 JS
      注入的, 一样晚。只有内联的 <style> 在首屏解析时就在。

      **html 和 body 两条都要写。** 视口用哪个元素的 overscroll-behavior, 跟着 overflow
      的 propagate 规则走: 这里 html 的 overflow 是 visible(全局没有任何 html/body 的
      overflow 规则), 于是 viewport-defining element 是 body。Chrome 140 之前就是从
      body propagate 的 —— 只写 html 那一条会被整个忽略, 照样能划走; 140 起才改成从
      html(root) propagate, 合规了但旧版本还在外面跑。两条都写才能同时盖住新旧
      Chrome / Edge, 也是这道防线搬进来之前 index.css 里原本的写法。

      Safari 的历史手势忽略 overscroll-behavior, 只认 wheel 的 preventDefault, 那一半在
      上面那个 hook 里。
    -->
    <style>html,body{overscroll-behavior-x:none}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
