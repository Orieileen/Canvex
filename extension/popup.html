<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 340px;
        margin: 0;
        font: 13px/1.5 system-ui, sans-serif;
        background: #0b0f14;
        color: #e5e7eb;
      }
      header {
        padding: 12px 14px;
        border-bottom: 1px solid #1f2937;
        font-weight: 600;
        color: #34d399;
      }
      .p {
        padding: 12px 14px;
      }
      button {
        font: inherit;
        border: 0;
        border-radius: 6px;
        padding: 8px 12px;
        cursor: pointer;
        margin: 0 6px 8px 0;
      }
      .primary {
        background: #10b981;
        color: #04140d;
        font-weight: 600;
      }
      .ghost {
        background: #1f2937;
        color: #e5e7eb;
      }
      .danger {
        background: #7f1d1d;
        color: #fee2e2;
      }
      #steps {
        margin: 6px 0;
        padding: 8px;
        background: #0f172a;
        border-radius: 6px;
        min-height: 24px;
        font-size: 12px;
      }
      #steps .s {
        padding: 2px 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #log {
        margin-top: 8px;
        max-height: 160px;
        overflow: auto;
        font: 11px/1.5 ui-monospace, monospace;
        color: #9ca3af;
      }
      #log .ok {
        color: #34d399;
      }
      #log .failed {
        color: #f87171;
      }
      .hint {
        color: #6b7280;
        font-size: 11px;
        margin-top: 4px;
      }
      #snaptree {
        margin: 6px 0;
        padding: 8px;
        background: #0f172a;
        border-radius: 6px;
        max-height: 220px;
        overflow: auto;
        font: 11px/1.5 ui-monospace, monospace;
        color: #cbd5e1;
        white-space: pre;
      }
      #snaptree .ref {
        color: #38bdf8;
        cursor: pointer;
        text-decoration: underline;
      }
      #snaptree .ref:hover {
        color: #7dd3fc;
      }
      #locout {
        font: 11px/1.5 ui-monospace, monospace;
        color: #34d399;
        word-break: break-all;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <header>Canvex RPA — 在你自己的浏览器里跑</header>
    <div class="p">
      <button id="demo" class="primary">跑 Demo:Google 搜 iPhone 17</button>
      <div class="hint">navigate → type「iPhone 17」→ 提交搜索。跑在你自己的浏览器/真实 IP。</div>
      <hr style="border-color: #1f2937; margin: 12px 0" />
      <button id="pick" class="ghost">开始点选</button>
      <button id="pickstop" class="ghost">停止点选</button>
      <button id="run" class="primary">运行已录步骤</button>
      <button id="clear" class="danger">清空</button>
      <div id="steps"></div>
      <div id="log"></div>
      <hr style="border-color: #1f2937; margin: 12px 0" />
      <button id="snap" class="ghost">拍快照 (AXTree)</button>
      <div class="hint">当前标签页的可访问性树 + <code>ref_N</code>。点某个 ref → 转成富定位(与点选同形)。</div>
      <div id="snapmeta" class="hint"></div>
      <pre id="snaptree"></pre>
      <div id="locout"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
